name: Regression check for duplicate recruitment notices
on:
  push:
    paths:
      - '.github/workflows/dedupe-check.yml'
      - 'tests/test_dedupe_live.js'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual-source deduplication
        run: node tests/test_dedupe_live.js
