name: Career Radar - refresh at Korean midnight and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
      timezone: 'Asia/Seoul'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: career-radar-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install -r requirements.txt
      - name: Run parser tests
        run: python -m unittest discover -s tests -v
      - name: Fetch permitted public listings
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-check]')
        run: python scripts/sync_jobs.py
        env:
          JASO_PAGES: '3'
      - name: Save updated public metadata to repository
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-check]')
        continue-on-error: true
        run: |
          git config user.name "Career Radar Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if ! git diff --staged --quiet; then
            git commit -m "data: refresh public recruitment listing metadata"
            git push origin HEAD:main
          fi
      - name: Prepare static deployment
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/jobs.json _site/data/jobs.json
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
