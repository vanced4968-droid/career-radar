name: Browser smoke test
on:
  push:
    paths:
      - 'index.html'
      - 'data/jobs.json'
      - 'tests/test_browser_boot.js'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight DOM test runner
        run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26
      - name: Verify calendar + listing + date navigation boot
        run: TZ=Asia/Seoul node tests/test_browser_boot.js
